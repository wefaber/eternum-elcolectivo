# /etc/nginx/sites-available/colectivo-static.eternum.lat
# El Colectivo — static site (repo wefaber/eternum-elcolectivo).
#
# Blue/green: deploy/colectivo-static.sh writes the live slot into
# /etc/nginx/snippets/colectivo-static-active.conf ($colectivo_static_root) and reloads nginx.
# Nothing here hardcodes a slot, so a flip moves the whole vhost at once.
#
# This is deliberately NOT colectivo.eternum.lat: that apex is served by wefaber/colectivo-site
# (snippet colectivo-active.conf) since the 2026-10-17 cutover.
server {
    listen 80;
    listen [::]:80;
    server_name colectivo-static.eternum.lat;
    return 301 https://$host$request_uri;
}

server {
    listen 167.114.2.210:443 ssl;
    listen [2607:5300:205:200::716d]:443 ssl;
    server_name colectivo-static.eternum.lat;

    include /etc/nginx/snippets/hsts.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/wellknown.conf;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/colectivo-static.eternum.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colectivo-static.eternum.lat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include snippets/colectivo-static-active.conf;
    root $colectivo_static_root;
    index index.html;

    # El entry HTML nunca se cachea: cada deploy rota los assets hasheados.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Assets con hash en el nombre: inmutables. add_header en la location corta la herencia,
    # asi que el snippet de security headers se repite.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /img/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
